name: Verificar calculos do acordo fechado

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir sintaxe
        run: |
          node --check settlement-core.js
          node --check app.js
      - name: Testar calculo financeiro e interface
        run: node --test tests/*.test.cjs
